# XcodeGen spec for the iOS app: `make ios-project` writes Reverb.xcodeproj
# from it, so the project file is generated, not hand-edited.
name: Reverb
options:
  bundleIdPrefix: io.github.uhhhm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    # Signing is the owner's: SideStore re-signs the unsigned IPA, or a paid
    # account signs it (ADR 0004). Set a team here only to run on a device
    # from Xcode.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ReverbKit:
    path: ReverbKit
targets:
  Reverb:
    type: application
    platform: iOS
    sources:
      - path: Reverb
    dependencies:
      - package: ReverbKit
        product: ReverbAPI
      # Built by `make ios-core` (gomobile bind); not checked in.
      - framework: Frameworks/Reverbcore.xcframework
      # The embedded download tools, from `make ios-native`; not checked in.
      # Python is a dynamic framework; ReverbNative (FFmpeg, QuickJS and the
      # _reverb_native module) is static.
      - framework: Frameworks/Python.xcframework
        embed: true
      - framework: Frameworks/ReverbNative.xcframework
        embed: false
      # Go's DNS resolver on Darwin calls res_9_* from libresolv.
      - sdk: libresolv.tbd
      # FFmpeg's PNG support.
      - sdk: libz.tbd
    postBuildScripts:
      - name: Install Python
        script: exec "$PROJECT_DIR/native/install-python.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.uhhhm.reverb
        INFOPLIST_FILE: Reverb/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        # The Go core, Python and ReverbNative are arm64 only.
        ARCHS: arm64
        # The Python install phase reads the bundled packages under build/.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  ReverbTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReverbTests
    dependencies:
      - target: Reverb
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReverbUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReverbUITests
    dependencies:
      - target: Reverb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.uhhhm.reverb.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reverb
schemes:
  Reverb:
    build:
      targets:
        Reverb: all
        ReverbTests: [test]
        ReverbUITests: [test]
    test:
      targets:
        - ReverbTests
        - ReverbUITests
