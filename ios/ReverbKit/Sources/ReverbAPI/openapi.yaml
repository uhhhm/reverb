          type: string
        artist:
          type: string
        coverArtId:
          type: string
        year:
          type: integer
        songCount:
          type: integer
        durationMs:
          type: integer
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LibraryTrack"
    LibraryArtist:
      type: object
      required:
        - id
        - name
        - coverArtId
        - albumCount
      properties:
        id:
          type: string
        name:
          type: string
        coverArtId:
          type: string
        albumCount:
          type: integer
        albums:
          type: array
          items:
            $ref: "#/components/schemas/LibraryAlbum"
    LibrarySearchResults:
      type: object
      required:
        - tracks
        - albums
        - artists
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LibraryTrack"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/LibraryAlbum"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/LibraryArtist"
    LibraryTrack:
      type: object
      description: A track of this device's library. Its id is this device's own and means nothing on another.
      required:
        - id
        - title
        - albumId
        - album
        - artistId
        - artist
        - coverArtId
        - trackNumber
        - discNumber
        - durationMs
        - bitRate
        - suffix
        - contentType
      properties:
        id:
          type: string
        title:
          type: string
        albumId:
          type: string
        album:
          type: string
        artistId:
          type: string
        artist:
          type: string
        coverArtId:
          type: string
          description: Pass to GET /cover/{id}; empty when there is no art.
        trackNumber:
          type: integer
        discNumber:
          type: integer
        durationMs:
          type: integer
          description: Zero when this device's library does not know it.
        bitRate:
          type: integer
        suffix:
          type: string
        contentType:
          type: string
        isrc:
          type: string
        mbid:
          type: string
        cropStartMs:
          type: integer
          description: Where playback starts, when the track is cropped.
        cropEndMs:
          type: integer
          description: Where playback stops; zero plays to the end.
    Mix:
      type: object
      description: A generated, regularly refreshed list of recommendations. Not a playlist and never replicated. period is the local date its period began on; available is false when nothing could be looked up.
      required:
        - kind
        - period
        - tracks
        - available
        - refreshing
      properties:
        kind:
          $ref: "#/components/schemas/MixKind"
        period:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedTrack"
        updatedAt:
          type: integer
          format: int64
        available:
          type: boolean
        offline:
          type: boolean
        refreshing:
          type: boolean
    MixKind:
      type: string
      enum:
        - discoverWeekly
        - releaseRadar
    MixList:
      type: object
      required:
        - mixes
      properties:
        mixes:
          type: array
          items:
            $ref: "#/components/schemas/Mix"
    NotInterestedMark:
      type: object
      required:
        - key
        - kind
        - artist
        - markedAt
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
            - track
            - artist
        title:
          type: string
        artist:
          type: string
        source:
          type: string
        externalId:
          type: string
        markedAt:
          type: integer
          format: int64
          description: Unix milliseconds
    NotInterestedRequest:
      type: object
      description: 'kind "track": source plus externalId, or source "library" with trackId (the backend track id). kind "artist": source plus id, and name.'
      required:
        - kind
        - source
      properties:
        kind:
          type: string
          enum:
            - track
            - artist
        source:
          type: string
        externalId:
          type: string
        trackId:
          type: string
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        durationMs:
          type: integer
        name:
          type: string
    OfflinePlaylistStatus:
      type: object
      required:
        - playlistId
        - playlistName
        - bytes
        - trackCount
        - readyCount
        - tracks
      properties:
        playlistId:
          type: string
        playlistName:
          type: string
        bytes:
          type: integer
          format: int64
          description: Space this playlist's files on the phone take.
        trackCount:
          type: integer
        readyCount:
          type: integer
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/OfflineTrackStatus"
    OfflineSetEntry:
      type: object
      required:
        - playlistId
        - enabled
        - playlistName
        - updatedAt
      properties:
        playlistId:
          type: string
        enabled:
          type: boolean
        playlistName:
          type: string
        updatedAt:
          type: integer
          format: int64
    OfflineStatus:
      type: object
      required:
        - usedBytes
        - availableBytes
        - full
        - spaceUnknown
        - playlists
      properties:
        usedBytes:
          type: integer
          format: int64
          description: Space the offline set's files take, each counted once.
        availableBytes:
          type: integer
          format: int64
          description: What fetching may still use, after the space kept free for the rest of the phone.
        full:
          type: boolean
          description: A track a paired device offers does not fit. Fetching has stopped; nothing was removed.
        spaceUnknown:
          type: boolean
          description: The phone's free space cannot be read; nothing is fetched until it can.
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/OfflinePlaylistStatus"
    OfflineTrackStatus:
      type: object
      required:
        - title
        - artist
        - state
        - sizeBytes
        - fetchedBytes
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        state:
          type: string
          enum:
            - ready
            - fetching
            - queued
            - noSpace
            - unavailable
          description: |
            ready — on the phone; fetching — being copied; queued — a paired device offers it; noSpace — offered but does not fit; unavailable — no paired device reached since the phone started offers it.
        sizeBytes:
          type: integer
          format: int64
          description: The file's size, once a file is known.
        fetchedBytes:
          type: integer
          format: int64
    PlayRequest:
      type: object
      properties:
        libraryTrackId:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        isrc:
          type: string
        durationMs:
          type: integer
        msPlayed:
          type: integer
        completed:
          type: boolean
        playedAt:
          type: integer
          format: int64
          description: Unix seconds; zero or omitted uses server time.
        origin:
          $ref: "#/components/schemas/RecommendationOrigin"
        sessionId:
          type: string
        qualified:
          type: boolean
          description: "Whether the play counts as a listen. Omitted for legacy clients and ordinary playback, which defaults to true. False records the attempt for recommendation stats only: it is never uploaded to a linked scrobbling account."
    PlayerEntryRequest:
      type: object
      properties:
        entryId:
          type: string
          description: |
            The entry the player was on. When it is no longer current the request is stale and changes nothing.
    PlayerJumpRequest:
      type: object
      required:
        - index
      properties:
        index:
          type: integer
    PlayerTrack:
      type: object
      additionalProperties: true
      description: |
        A track as the player plays it. The core stores it exactly as sent and hands it back; only the player reads its fields. The desktop sends its library or external track object.
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        durationMs:
          type: integer
        cropStartMs:
          type: integer
          description: Start of the non-destructive playback window.
        cropEndMs:
          type: integer
          description: End of the playback window; zero plays to the end.
    PlayerTracksRequest:
      type: object
      required:
        - tracks
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/PlayerTrack"
        origin:
          type: string
          enum:
            - listener
            - radio
          default: listener
        start:
          type: integer
          description: For play, the position to start at.
    PlaylistTrack:
      type: object
      required:
        - state
        - playback
        - title
        - artist
        - trackNumber
        - durationMs
      properties:
        state:
          type: string
          enum:
            - full
            - none
            - partial
            - pending
          description: full when this device's library holds the track, which libraryTrack then names.
        libraryTrack:
          $ref: "#/components/schemas/LibraryTrack"
        canonicalId:
          type: string
          description: Stable track id used for Delegated playback; absent for external-only results.
        playback:
          type: string
          enum:
            - local
            - delegated
            - unavailable
          description: Where this Device can play the track right now.
        externalRef:
          $ref: "#/components/schemas/ExternalTrackRef"
        key:
          $ref: "#/components/schemas/TrackKey"
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        trackNumber:
          type: integer
        durationMs:
          type: integer
        coverUrl:
          type: string
        cropStartMs:
          type: integer
          description: Where playback starts, including delegated tracks.
        cropEndMs:
          type: integer
          description: Where playback stops; zero plays to the end.
        artistExternalId:
          type: string
        albumExternalId:
          type: string
    QueueEntry:
      type: object
      required:
        - id
        - origin
        - track
      properties:
        id:
          type: string
          description: Unique to this entry, even when the same track is queued twice.
        origin:
          type: string
          enum:
            - listener
            - radio
          description: Who queued it. A listener's tracks play before Radio's.
        track:
          $ref: "#/components/schemas/PlayerTrack"
    QueueState:
      type: object
      required:
        - entries
        - index
        - shuffle
        - repeat
        - upNext
        - playId
        - finished
        - revision
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QueueEntry"
        index:
          type: integer
          description: The current entry, or -1 with nothing to play.
        shuffle:
          type: boolean
        repeat:
          type: string
          enum:
            - off
            - all
            - one
        upNext:
          type: array
          items:
            type: integer
          description: |
            Positions that play after the current one, in play order (under shuffle, the rest of the shuffle order). At most 20.
        playId:
          type: integer
          format: int64
          description: |
            Changes whenever the current entry has to start again from its beginning; a player loads the current entry when it does.
        finished:
          type: boolean
          description: The last track ended with nothing after it.
        revision:
          type: integer
          format: int64
          description: Changes on every change to the queue.
    RadioSeed:
      type: object
      description: A track, or an artist when title is omitted.
      required:
        - artist
      properties:
        artist:
          type: string
        title:
          type: string
        mbid:
          type: string
    RecommendationOrigin:
      type: string
      enum:
        - radio
        - mix
        - shelf
        - similarTracks
        - similarArtists
    RecommendationReason:
      type: object
      description: "Why something was recommended. artist and title name the seed. played: \"Because you played <title>\". similar: \"Similar to <title>\". fansAlsoLike: \"Fans of <artist> also like\". radioArtist: one of the seed artist's own tracks, leading a Radio started from that artist. moreFrom: \"More from <artist>\". newRelease: a Release Radar track, with title naming the release. personal: from the connected ListenBrainz account's own recommendations, with no seed; artist is empty."
      required:
        - kind
        - artist
      properties:
        kind:
          type: string
          enum:
            - played
            - similar
            - fansAlsoLike
            - radioArtist
            - moreFrom
            - newRelease
            - personal
        artist:
          type: string
        title:
          type: string
    RecommendedTrack:
      type: object
      description: A playable recommendation. A library track has source "library", externalId set to the backend track id, canonicalId set to its catalog id, and match.status "in_library"; anything else is a search-source result that plays through external playback.
      required:
        - source
        - externalId
        - title
        - artist
        - album
        - durationMs
        - type
      properties:
        source:
          type: string
        externalId:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        durationMs:
          type: integer
        isrc:
          type: string
        mbid:
          type: string
        recommendationSources:
          type: array
          items:
            type: string
        reason:
          $ref: "#/components/schemas/RecommendationReason"
        coverUrl:
          type: string
        coverArtId:
          type: string
        artistExternalId:
          type: string
        albumExternalId:
          type: string
        type:
          type: string
        canonicalId:
          type: string
        match:
          type: object
          required:
            - status
            - libraryTrackId
            - method
            - confidence
          properties:
            status:
              type: string
              enum:
                - in_library
                - not_in_library
                - unknown
            libraryTrackId:
              type: string
            method:
              type: string
            confidence:
              type: number
            artistId:
              type: string
            albumId:
              type: string
            coverArtId:
              type: string
    SaveMixRequest:
      type: object
      properties:
        name:
          type: string
          description: The playlist's name; defaults to the Mix's
    Shelf:
      type: object
      description: One "For you" row. It holds tracks or artists.
      required:
        - kind
        - tracks
        - artists
      properties:
        kind:
          $ref: "#/components/schemas/ShelfKind"
        seed:
          $ref: "#/components/schemas/RadioSeed"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedTrack"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ExternalArtist"
    ShelfKind:
      type: string
      description: becauseYouPlayed and similarTo name their seed track (similarTo when seeded from the library before anything is played).
      enum:
        - becauseYouPlayed
        - similarTo
        - artistsYouMightLike
        - moreFromArtistsYouLove
    SyncRound:
      type: object
      description: Metadata exchange status. Local projection and file transfers run independently in the background.
      required:
        - id
        - state
        - startedAt
        - finishedAt
        - durationMs
        - peers
        - succeeded
        - errors
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum:
            - idle
            - pending
            - running
            - completed
            - failed
            - no_peers
        startedAt:
          type: integer
          format: int64
          description: Unix milliseconds
        finishedAt:
          type: integer
          format: int64
          description: Unix milliseconds
        durationMs:
          type: integer
          format: int64
        peers:
          type: integer
        succeeded:
          type: integer
        errors:
          type: array
          items:
            type: string
    SyncedPlaylist:
      type: object
      required:
        - id
        - source
        - externalId
        - name
        - mode
        - syncEnabled
        - syncIntervalSec
        - autoDownload
        - lastSyncedAt
        - trackCount
      properties:
        id:
          type: string
        source:
          type: string
          description: local for a playlist made in Reverb.
        externalId:
          type: string
        name:
          type: string
        coverUrl:
          type: string
        mode:
          type: string
          description: once for a playlist whose tracklist replicates; synced for a mirror of an upstream playlist.
        syncEnabled:
          type: boolean
        syncIntervalSec:
          type: integer
        autoDownload:
          type: boolean
        lastSyncedAt:
          type: integer
          format: int64
        trackCount:
          type: integer
    SyncedPlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/SyncedPlaylist"
        - type: object
          required:
            - ownedCount
            - totalCount
            - tracks
          properties:
            ownedCount:
              type: integer
            totalCount:
              type: integer
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/PlaylistTrack"
    TrackKey:
      type: object
      required:
        - source
        - externalId
      properties:
        source:
          type: string
        externalId:
          type: string
