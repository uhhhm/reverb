          type: string
        mbid:
          type: string
        recommendationSources:
          type: array
          items:
            type: string
        reason:
          $ref: "#/components/schemas/RecommendationReason"
        coverUrl:
          type: string
        coverArtId:
          type: string
    ExternalTrackRef:
      type: object
      required:
        - source
        - externalId
        - title
        - durationMs
      properties:
        source:
          type: string
        externalId:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        isrc:
          type: string
        durationMs:
          type: integer
    HomeShelves:
