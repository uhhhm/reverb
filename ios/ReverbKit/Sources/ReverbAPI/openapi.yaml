        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peerId:
                  type: string
                  description: |
                    Either a bare peer ID or a full multiaddr ending in /p2p/<peerID>, or empty to try every Reverb device discovered on the local network. The bare form only resolves where discovery has already found the peer (a LAN, via mDNS); over a VPN the full multiaddr from the other device's dialAddrs is required.
                  example: /ip4/10.8.0.2/tcp/4331/p2p/12D3KooW...
