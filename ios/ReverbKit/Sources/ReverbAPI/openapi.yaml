        - refreshing
      properties:
        shelves:
          type: array
          items:
            $ref: "#/components/schemas/Shelf"
        updatedAt:
          type: integer
          format: int64
        offline:
          type: boolean
        refreshing:
          type: boolean
    LibraryAlbum:
      type: object
      required:
        - id
        - name
        - artistId
        - artist
        - coverArtId
        - year
        - songCount
        - durationMs
