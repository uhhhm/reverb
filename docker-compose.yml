# Start with: docker compose up -d
#
# Reverb stores its database in a managed Docker volume and uses ./music for
# downloads. Optional settings live in .env; copy .env.example
# only when you need an existing music folder, a version pin, or credentials.

services:
  reverb:
    image: ghcr.io/uhhhm/reverb:${REVERB_VERSION:-latest}
    ports:
      - "8090:8090"
      - "4331:4331"
      - "4331:4331/udp"
    environment:
      # A container binds every interface so Docker's port mapping works; the
      # "8090:8090" line above is the real exposure decision. Publish to
      # 127.0.0.1:8090:8090 instead unless an authenticating proxy fronts it.
      REVERB_BIND: 0.0.0.0
      # Reverb refuses a non-loopback bind unless this is set, because the API
      # has no authentication of its own. In a container the bind is not the
      # boundary -- the port mapping is -- so the acknowledgement belongs here.
      REVERB_ALLOW_NETWORK_ACCESS: "1"
      # Hostnames you browse Reverb by. Reverb accepts a state-changing request
      # only when its Host is loopback or listed here, which is what stops a
      # DNS-rebinding page from driving the API. Browsing by localhost works
      # unlisted; anything else (a LAN name, a proxy's public hostname) must be
      # added or writes return 403.
      # REVERB_ALLOWED_HOSTS: "nas.local,music.example.com"
      REVERB_ADMIN_PASSWORD: ${REVERB_ADMIN_PASSWORD:-}
      REVERB_SPOTIFY_CLIENT_ID: ${REVERB_SPOTIFY_CLIENT_ID:-}
      REVERB_SPOTIFY_CLIENT_SECRET: ${REVERB_SPOTIFY_CLIENT_SECRET:-}
      REVERB_LIBRARY_PASSWORD: ${REVERB_LIBRARY_PASSWORD:-}
      REVERB_DOWNLOAD_WORKERS: ${REVERB_DOWNLOAD_WORKERS:-}
      REVERB_NAVIDROME_LISTEN_ADDRESS: ${REVERB_NAVIDROME_LISTEN_ADDRESS:-}
    volumes:
      - reverb-data:/data
      - "${REVERB_MUSIC_DIR:-./music}:/music"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  reverb-data:
