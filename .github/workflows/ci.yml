name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  GOVULNCHECK_VERSION: v1.6.0
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.5', cache: true }
      - run: make gen-check
      - run: make vet
      # Windows-only files — the _windows_test.go guards for the paths and
      # device names that only Windows refuses — are invisible to every check
      # above, so a rename can break them and still look green here. Vetting
      # cross-compiled catches that in seconds on a Linux runner, instead of
      # after the Windows job has finished building the whole desktop app.
      - name: Vet for Windows
        run: make vet-windows
      - run: make test-race
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.5', cache: true }
      - name: Check Go formatting
        run: make fmt-check
      - name: Cache golangci-lint
        id: golangci-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2.12.2
      - name: golangci-lint
        run: |
          if [ "${{ steps.golangci-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          fi
          golangci-lint run ./cmd/... ./internal/...
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.5', cache: true }
      - name: Cache govulncheck
        id: govulncheck-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-govulncheck-${{ env.GOVULNCHECK_VERSION }}
      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck ./...
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.5', cache: true }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Windows desktop tools
        id: windows-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            desktop/tools/bin
            desktop/tools/python
          # Keyed on the fetch scripts and the launcher source they compile:
          # every pinned version lives in them, so a bump invalidates the cache
          # without a second edit here.
          key: windows-desktop-tools-v1-${{ hashFiles('desktop/tools/fetch-ffmpeg.sh', 'desktop/tools/fetch-navidrome.sh', 'desktop/tools/fetch-deno.sh', 'desktop/tools/setup-python-venv.sh', 'desktop/tools/python-launcher/**') }}
      - name: Fetch Windows desktop tools
        if: steps.windows-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGETOS: windows
          TARGETARCH: amd64
        run: |
          desktop/tools/fetch-ffmpeg.sh
          desktop/tools/fetch-navidrome.sh
          desktop/tools/fetch-deno.sh
          desktop/tools/setup-python-venv.sh
      - name: Smoke-test Windows desktop tools
        shell: pwsh
        run: |
          & desktop/tools/bin/ffmpeg.exe -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=0.1" -y "$env:RUNNER_TEMP\reverb-tone.wav"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\reverb-tone.wav")) { throw "ffmpeg smoke test failed" }
          & desktop/tools/bin/deno.exe eval "if (1 + 1 !== 2) Deno.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw "deno smoke test failed" }
          & desktop/tools/python/python.exe -c "import spotdl, yt_dlp"
          if ($LASTEXITCODE -ne 0) { throw "bundled Python packages are unavailable" }
          & desktop/tools/bin/spotdl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "spotDL launcher smoke test failed" }
          & desktop/tools/bin/yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp launcher smoke test failed" }
          & desktop/tools/bin/navidrome.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Navidrome smoke test failed" }
      - name: Build and embed the SPA
        run: |
          npm ci --prefix web
          npm run build --prefix web
          if (Test-Path internal/api/dist) { Remove-Item -Recurse -Force internal/api/dist }
          Copy-Item -Recurse web/dist internal/api/dist
      # The same script make desktop-windows and the release workflow run.
      - name: Build the desktop binary
        shell: bash
        run: bash desktop/build/windows/build.sh "${{ github.sha }}"
      - name: Check the binary is a GUI application carrying the Reverb icon
        run: go run ./desktop/tools/verify-windows-artifact -exe dist/reverb-desktop.exe
      # Replication is the half of Reverb a cross-platform household hits first,
      # and Windows is the platform whose filesystem rules differ. Building the
      # desktop shell here proved only that the code compiles; these suites —
      # sync, p2p, the portable-name rules, the migration that renames an
      # established library, and the two-device end-to-end test that boots two
      # complete runtimes and pairs them over loopback — are what make a Windows
      # sync regression fail CI instead of reaching a release.
      - name: Desktop, paths, embedded-library and child-process tests
        run: go test ./desktop/... ./internal/desktop/... ./internal/library/embedded/... ./internal/childproc/...
      - name: Sync, P2P and two-device end-to-end tests
        run: go test ./internal/sync/... ./internal/p2p/... ./internal/app/... ./internal/portablename/... ./internal/portablemigrate/...
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.5', cache: true }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - run: make setup-contracts contracts-check contracts-test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: make -C .. check-web
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reverb:ci
          # Reuse dependency, web-build, Go-build, and runtime-image layers
          # across push and pull-request checks.
          cache-from: type=gha,scope=reverb-amd64
          cache-to: type=gha,mode=max,scope=reverb-amd64
          build-args: |
            VERSION=${{ github.sha }}
      - name: Smoke-test the image
        run: |
          docker run -d --name reverb-ci -p 18090:8090 reverb:ci --db /tmp/ci.db
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:18090/api/v1/version; then ok=1; break; fi
            sleep 1
          done
          docker logs reverb-ci
          test "${ok:-0}" = "1"
          curl -fsS http://localhost:18090/api/v1/version | grep "${GITHUB_SHA}"
          docker rm -f reverb-ci
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
