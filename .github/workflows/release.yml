name: Release

# A stable release may publish only the current main commit after its CI
# workflow has succeeded. A prerelease (alpha/beta/rc, marked "prerelease" on
# the GitHub Release) may publish any commit as long as CI succeeded for it —
# this lets alphas be cut from a feature branch/PR commit without waiting for
# it to land on main. Either way, a commit with failed (or no) CI can never
# become a public image.
on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  verify-release:
    name: Verify release source
    # ios-source and ytdlp-* are channel releases whose assets other jobs
    # publish; they are never builds of their own.
    if: github.event.release.tag_name != 'ios-source' && !startsWith(github.event.release.tag_name, 'ytdlp-')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: source
        name: Resolve the release commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - name: Require the release tag to match main (stable releases only)
        if: github.event.release.prerelease == false
        env:
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          main_sha="$(git rev-parse origin/main)"
          test "$SHA" = "$main_sha"
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          successful_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$SHA" \
            --status completed \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -gt 0

  build-amd64:
    name: Build & Push AMD64
    needs: verify-release
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/reverb:build-${{ github.sha }}-amd64
          cache-from: type=gha,scope=reverb-amd64
          cache-to: type=gha,scope=reverb-amd64,mode=max
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            YTDLP_BUILD_STAMP=${{ github.run_id }}
          provenance: true

  build-arm64:
    name: Build & Push ARM64
    needs: verify-release
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/reverb:build-${{ github.sha }}-arm64
          cache-from: type=gha,scope=reverb-arm64
          cache-to: type=gha,scope=reverb-arm64,mode=max
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            YTDLP_BUILD_STAMP=${{ github.run_id }}
          provenance: true

  publish-manifest:
    name: Publish multi-arch image
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image manifest
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          image="ghcr.io/${{ github.repository_owner }}/reverb"

          # Prereleases (alpha/beta/rc) get their exact version tag plus a
          # moving `alpha` tag, and never touch `latest`. Stable releases get
          # their version tag plus `latest`.
          tag_args=(-t "${image}:${version}")
          if [ "$PRERELEASE" = "true" ]; then
            tag_args+=(-t "${image}:alpha")
          else
            tag_args+=(-t "${image}:latest")
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${image}@${{ needs.build-amd64.outputs.digest }}" \
            "${image}@${{ needs.build-arm64.outputs.digest }}"
      - name: Attach notes to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true

  # The iPhone app (ADR 0004): an unsigned IPA that SideStore or AltStore signs
  # with the owner's Apple ID, or the owner signs with a paid account. Stable
  # releases also refresh the source at the stable URL
  # https://github.com/<repo>/releases/download/ios-source/source.json, which the
  # phone's update banner and the owner's SideStore read.
  build-ios:
    name: Build unsigned IPA
    needs: verify-release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the embedded tools and the core
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          make ios-native
          make ios-core VERSION="${TAG#v}"
          make ios-project
      - name: Archive without signing
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          # CFBundleShortVersionString is numeric; a prerelease suffix stays in the tag.
          marketing="${version%%-*}"
          cd ios
          xcodebuild archive -project Reverb.xcodeproj -scheme Reverb -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Reverb.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$marketing" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Reverb.xcarchive/Products/Applications/Reverb.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Reverb.ipa" Payload)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/ipa/Payload/Reverb.app/Info.plist"
      - name: Attach the IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" Reverb.ipa --clobber
      - name: Publish the SideStore/AltStore source
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ needs.verify-release.outputs.sha }}
        run: |
          # A channel release: a prerelease so it never becomes "latest", which
          # the desktop updater and the phone's banner read.
          if ! gh release view ios-source >/dev/null 2>&1; then
            gh release create ios-source --target "$SHA" --prerelease --latest=false \
              --title "iOS app source" --notes "The SideStore/AltStore source for Reverb on iPhone. Add source.json's URL in SideStore."
          fi
          gh release download ios-source --pattern source.json --dir "$RUNNER_TEMP/previous" || true
          node scripts/ios-source.mjs --repo "$GITHUB_REPOSITORY" --version "$TAG" \
            --date "$(date -u +%Y-%m-%d)" --size "$(stat -f%z Reverb.ipa)" \
            --previous "$RUNNER_TEMP/previous/source.json" --out source.json
          gh release upload ios-source source.json --clobber
