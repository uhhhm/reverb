name: desktop
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.2.3)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Verify release and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          test "$draft" = false
          prerelease="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" = false ]; then
            test "$sha" = "$(git rev-parse origin/main)"
          fi
          runs="$(gh run list --workflow ci.yml --commit "$sha" --status completed \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          test "$runs" -gt 0
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            arch: amd64
            tags: desktop,production
          - os: macos-14
            goos: darwin
            arch: arm64
            tags: desktop,production
          - os: ubuntu-24.04
            goos: linux
            arch: amd64
            tags: desktop,production,webkit2_41
          - os: ubuntu-24.04-arm
            goos: linux
            arch: arm64
            tags: desktop,production,webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config zip
      - run: make setup-web
      - name: Build and test the native desktop update
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          go test ./desktop/... ./internal/desktop/...
          make desktop VERSION="$TAG" WAILS_TAGS="$BUILD_TAGS"
          test -x dist/reverb-desktop
          if [ "$TARGET_OS" = darwin ]; then
            codesign --force -s - dist/reverb-desktop
            codesign --verify dist/reverb-desktop
          fi
          # This is the updater's exact payload format, not a .deb/AppImage or
          # a full app bundle. Existing bundled tools remain beside the app.
          artifact="reverb-desktop-${TAG#v}-${TARGET_OS}-${TARGET_ARCH}.zip"
          (cd dist && zip "$artifact" reverb-desktop)
          unzip -t "dist/$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # Windows is a separate job rather than a matrix row: the build, the GUI and
  # icon checks, and the zip all have to run in PowerShell, and threading that
  # through the bash matrix step would obscure both.
  build-windows:
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and embed the SPA
        run: |
          npm ci --prefix web
          npm run build --prefix web
          if (Test-Path internal/api/dist) { Remove-Item -Recurse -Force internal/api/dist }
          Copy-Item -Recurse web/dist internal/api/dist
      - run: go test ./desktop/... ./internal/desktop/...
      # The same script make desktop-windows and the CI `windows` job run, so
      # the tags, the GUI-subsystem link and the version stamp cannot drift.
      - name: Build the desktop binary
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: bash desktop/build/windows/build.sh "$TAG"
      - name: Check the binary is a GUI application carrying the Reverb icon
        run: go run ./desktop/tools/verify-windows-artifact -exe dist/reverb-desktop.exe
      # This is the updater's exact payload format: the bare executable, under
      # the name the updater unpacks by.
      - name: Package and verify the updater payload
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          artifact="reverb-desktop-${TAG#v}-windows-amd64.zip"
          powershell -Command "Compress-Archive -Path dist/reverb-desktop.exe -DestinationPath dist/$artifact"
          go run ./desktop/tools/verify-windows-artifact -zip "dist/$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Attach all five verified builds to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          test "$(find dist -name '*.zip' | wc -l)" -eq 5
          gh release upload "$TAG" dist/*.zip --clobber
