openapi: 3.0.3
info:
  title: Reverb API
  version: 0.1.0
  description: >
    Reverb is a self-hosted music app unifying a Subsonic/Navidrome library,
    Spotify search, and spotDL one-click download. All paths are served under
    /api/v1. The local browser UI is implicitly authenticated as the single
    household owner ("local"); paired devices authenticate to /sync with Bearer
    sync tokens (issued from one-time pairing codes) and to P2P via libp2p peer
    IDs bound at pairing.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness probe
      responses: { "200": { description: ok } }
  /version:
    get:
      summary: Build version and update-check repository
      responses:
        "200":
          description: version string, and the GitHub owner/name polled for updates ("" when disabled)
          content:
            application/json:
              schema:
                type: object
                properties: { version: { type: string }, updateRepo: { type: string } }
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      responses: { "200": { description: yaml } }
  /me:
    get:
      summary: The household owner's identity and capabilities (local owner)
      responses: { "200": { description: ok } }
  /adapters/available:
    get:
      summary: Registered adapter types with config schemas and capabilities
      responses: { "200": { description: ok } }
  /adapters:
    get:
      summary: List configured adapter instances (secrets redacted)
      responses: { "200": { description: ok }, "401": { description: unauthorized } }
    post:
      summary: Create an adapter instance
      responses: { "200": { description: created }, "400": { description: invalid } }
  /adapters/{id}:
    put:
      summary: Update an adapter instance
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: updated }, "404": { description: not found } }
    delete:
      summary: Delete an adapter instance
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: deleted }, "404": { description: not found } }
  /adapters/test:
    post:
      summary: Test an adapter configuration (TestConnection) without persisting
      responses: { "200": { description: "{ ok: bool, error?: string }" } }
  /settings:
    get:
      summary: Read app settings
      responses: { "200": { description: ok } }
    put:
      summary: Update app settings (sets the restart-to-apply flag)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accentColor: { type: string }
                dynamicBackground: { type: boolean }
                libraryBackendMode: { type: string, enum: ["", built-in, external] }
                downloadQuality:
                  type: string
                  enum: [low, medium, high, best]
                  description: Default audio quality tier for new downloads (a ceiling, never an upscale).
                theme:
                  type: string
                  enum: [default-dark, catppuccin-mocha, catppuccin-macchiato, catppuccin-frappe]
                  description: UI theme — all dark, Catppuccin-inspired.
                audioNormalization:
                  type: boolean
                  description: Apply a per-track playback gain so tracks sound level. Files are never re-encoded.
      responses:
        "200": { description: ok, pendingRestart flag included }
        "400": { description: invalid value }
  /config/pending-restart:
    get:
      summary: Whether config changed since startup (restart-to-apply banner)
      responses: { "200": { description: "{ pending: bool }" } }
  /library/search:
    get:
      summary: Fast REST search of the local library (tracks/albums/artists)
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: SearchResults } }
  /library/artists:
    get:
      summary: List library artists
      responses: { "200": { description: ok } }
  /library/artist/{id}:
    get:
      summary: One artist with albums
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /library/album/{id}:
    get:
      summary: One album with tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /library/albums:
    get:
      summary: List albums
      parameters: [{ name: type, in: query, required: false, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /library/songs:
    get:
      summary: List every song in the library
      parameters:
        - { name: size, in: query, required: false, schema: { type: integer }, description: Maximum songs to return; omit for everything }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses: { "200": { description: ok } }
  /library/track/{id}/name:
    put:
      summary: Rename a library track (Reverb-side display override; file tags are never rewritten)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: Blank keeps the library's own title }
                artist: { type: string, description: Blank keeps the library's own artist }
      responses:
        "200": { description: the stored override }
        "503": { description: renaming unavailable }
  /library/upload:
    post:
      summary: Upload audio files into the managed music directory (built-in library only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: what was accepted and what was refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer, format: int64 }
                  rejected: { type: object, additionalProperties: { type: string } }
                  scanning: { type: boolean }
        "400": { description: invalid form or no files field }
        "422": { description: nothing was accepted }
        "503": { description: uploads need the built-in library }
  /library/track/{id}/quality:
    get:
      summary: A track's standing download quality (its override, else the global setting)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: quality
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality: { type: string, enum: [low, medium, high, best] }
                  overridden: { type: boolean }
                  default: { type: string, enum: [low, medium, high, best] }
    put:
      summary: Set (or, with an empty quality, clear) a track's quality override
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quality: { type: string, enum: ["", low, medium, high, best] }
      responses:
        "200": { description: the resulting quality }
        "400": { description: unknown tier }
        "503": { description: per-track quality unavailable }
  /library/loudness/backfill:
    get:
      summary: Progress of the bulk loudness measurement pass
      responses:
        "200":
          description: state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  total: { type: integer }
                  done: { type: integer }
                  skipped: { type: integer }
                  failed: { type: integer }
                  error: { type: string }
                  startedAt: { type: integer, format: int64 }
    post:
      summary: Measure every library track's loudness up front
      description: >-
        Normal operation measures a track the first time it is played. This is
        the opt-in bulk pass; it returns immediately and reports progress via
        GET on the same path. Already-measured tracks are skipped.
      responses:
        "202": { description: started }
        "409": { description: already measuring }
        "503": { description: needs a library whose files are on this machine }
  /library/loudness/backfill/cancel:
    post:
      summary: Stop a measurement pass (everything measured so far is kept)
      responses:
        "200": { description: state }
  /library/track/{id}/crop:
    get:
      summary: A track's playback boundaries (zeroes mean the whole file)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Crop }
        "503": { description: cropping unavailable }
    put:
      summary: Set non-destructive playback boundaries for a track
      description: >-
        The audio file is never rewritten — the player starts at startMs and
        stops at endMs, so a crop can be changed or removed at any time.
        startMs=0 with endMs=0 clears the crop.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startMs: { type: integer }
                endMs: { type: integer, description: 0 means play to the end of the file }
      responses:
        "200": { description: the stored crop }
        "400": { description: end is not after start }
        "503": { description: cropping unavailable }
    delete:
      summary: Uncrop a track (restores full-length playback)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: the cleared crop }
        "503": { description: cropping unavailable }
  /library/track/{id}/gain:
    get:
      summary: Playback gain in dB that brings the track to Reverb's reference loudness
      description: >-
        Measured with ffmpeg on first request and cached. The audio file is never
        modified — the gain is applied by the player.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: gain
          content:
            application/json:
              schema:
                type: object
                properties:
                  gainDb: { type: number, format: double }
        "204": { description: no measurement possible (no local file or no ffmpeg) }
  /library/track/{id}/peaks:
    get:
      summary: Waveform peaks for a local track (computed on demand; embedded library only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: waveform data }, "204": { description: peaks unavailable } }
  /library/track/{id}/duration:
    get:
      summary: Measured playable length of a local track, in ms (decoded on demand, cached; embedded library only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: measured duration }, "204": { description: measurement unavailable } }
  /library/track/{id}/lyrics:
    get:
      summary: Lyrics for a track (local tags/sidecar → LRCLIB, DB-cached)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: durationMs, in: query, schema: { type: integer } }
      responses: { "200": { description: lyrics payload }, "204": { description: lyrics unavailable } }
  /collection:
    get:
      summary: Cached discography coverage summary
      responses: { "200": { description: collection summary } }
  /library/playlists:
    get:
      summary: List playlists
      responses: { "200": { description: ok } }
  /library/playlist/{id}:
    get:
      summary: One playlist with its tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Playlist }, "404": { description: not found } }
    put:
      summary: Rename a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses: { "200": { description: '{"ok":true}' }, "400": { description: name is required }, "502": { description: upstream error } }
    delete:
      summary: Delete a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: '{"ok":true}' }, "502": { description: upstream error } }
  /library/playlist/{id}/remove:
    post:
      summary: Remove tracks at given zero-based indices from a playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                indices:
                  type: array
                  items: { type: integer }
              required: [indices]
      responses: { "200": { description: '{"ok":true}' }, "400": { description: indices is required }, "502": { description: upstream error } }
  /stream/{id}:
    get:
      summary: Stream/transcode-proxy a library track by id (Range supported)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: t
          in: query
          required: false
          description: >
            Start the stream this many ms into the track. The backend transcodes
            from that position, which is exact where a byte-range seek is a
            guess; the inbound Range header is ignored.
          schema: { type: integer }
      responses: { "200": { description: audio bytes }, "206": { description: partial content }, "404": { description: not found } }
  /external/stream/{source}/{id}:
    get:
      summary: >
        Stream a search result that is not in the library, without downloading it
        (Range supported). Writes no file, creates no download job, and triggers
        no library scan.
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: artist, in: query, required: false, schema: { type: string } }
        - { name: title, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: audio bytes }
        "206": { description: partial content }
        "502": { description: could not resolve a playable source }
        "503": { description: external streaming unavailable (no search source configured) }
  /external/stream/{source}/{id}/prewarm:
    post:
      summary: >
        Resolve and cache a playable URL for an external track without fetching
        audio, so the resolve overlaps the user deciding to play it.
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: artist, in: query, required: false, schema: { type: string } }
        - { name: title, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: resolved and cached }
        "502": { description: could not resolve a playable source }
        "503": { description: external streaming unavailable (no search source configured) }
  /cover/{id}:
    get:
      summary: Cover art proxy by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer } }
      responses: { "200": { description: image bytes } }
  /search/everywhere:
    get:
      summary: >
        Search-everywhere as Server-Sent Events. Streams one envelope per source
        (text/event-stream); each event data is a JSON SearchEnvelope with
        per-result library match status.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [track, album, artist] } }
      responses:
        "200":
          description: SSE stream of search envelopes
          content:
            text/event-stream:
              schema: { type: string }
  /artist/{source}/{id}:
    get:
      summary: External artist detail (bio, albums, related)
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: ArtistDetail }, "404": { description: not found } }
  /artist/{source}/{id}/coverage:
    get:
      summary: >
        SSE stream of album coverage status. Each event data is a JSON
        AlbumCoverage indicating whether each album is in the local library.
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE stream of AlbumCoverage events
          content:
            text/event-stream:
              schema: { type: string }
  /album/{source}/{id}:
    get:
      summary: External album detail (tracks, metadata)
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: AlbumDetail }, "404": { description: not found } }
  /downloads:
    get:
      summary: List download jobs
      responses: { "200": { description: array of DownloadJob } }
    post:
      summary: Enqueue a one-click download (deduped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                externalId: { type: string }
                artist: { type: string }
                title: { type: string }
                album: { type: string }
                isrc: { type: string }
                playWhenReady: { type: boolean }
                quality:
                  type: string
                  enum: [low, medium, high, best]
                  description: Overrides the configured default quality for this download.
              required: [source, externalId, artist, title]
      responses: { "200": { description: DownloadJob }, "400": { description: invalid } }
  /downloads/pause:
    post:
      summary: Pause the download queue (stop dispatching new jobs)
      responses: { "200": { description: "{paused:true}" } }
  /downloads/resume:
    post:
      summary: Resume the download queue
      responses: { "200": { description: "{paused:false}" } }
  /downloads/queue:
    get:
      summary: Queue state (paused flag)
      responses: { "200": { description: "{paused:boolean}" } }
  /downloads/clear:
    post:
      summary: Clear finished downloads (hard delete); body {ids?} else all finished
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { ids: { type: array, items: { type: string } } }
      responses: { "200": { description: "{removed:number}" } }
  /downloads/{id}/clear:
    post:
      summary: Clear a single finished download (hard delete)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "422": { description: job is active } }
  /downloads/{id}/cancel:
    post:
      summary: Cancel a queued/running download
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /downloads/{id}/retry:
    post:
      summary: Retry a failed/canceled download
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: DownloadJob }, "404": { description: not found } }
  /synced-playlists:
    get:
      summary: List imported (synced) playlists
      responses: { "200": { description: array of SyncedPlaylist }, "500": { description: store error }, "503": { description: playlist sync unavailable } }
    post:
      summary: Import a playlist by URL (idempotent on source+externalId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                downloadMissing: { type: boolean }
              required: [url]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "400": { description: url is required }
        "422": { description: bad or inaccessible playlist URL }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}:
    get:
      summary: Synced-playlist detail with live per-track ownership
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "404": { description: not found }
        "503": { description: playlist sync unavailable }
    delete:
      summary: Delete a synced playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "503": { description: playlist sync unavailable } }
  /synced-playlists/{id}/sync:
    post:
      summary: Re-fetch the playlist from its source now
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: SyncedPlaylistDetail }
        "422": { description: sync failed }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}/download-missing:
    post:
      summary: Enqueue downloads for the playlist's missing tracks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: array of DownloadJob }
        "422": { description: could not enqueue }
        "503": { description: playlist sync unavailable }
  /synced-playlists/{id}/settings:
    put:
      summary: Update auto-sync schedule + auto-download for a synced playlist
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                syncEnabled: { type: boolean }
                intervalSec: { type: integer }
                autoDownload: { type: boolean }
      responses:
        "200": { description: ok }
        "422": { description: update failed }
        "503": { description: playlist sync unavailable }
  /offline-set:
    get:
      summary: List offline set for server device (local-only, per-playlist)
      responses: { "200": { description: ok } }
  /offline-set/{playlistId}:
    put:
      summary: Set offline enabled for a playlist (local-only, never syncs)
      parameters: [{ name: playlistId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { enabled: { type: boolean } }
              required: [enabled]
      responses: { "200": { description: ok }, "404": { description: not found } }
    delete:
      summary: Remove playlist from offline set (local-only)
      parameters: [{ name: playlistId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: not found } }
  /downloads/upgrade:
    post:
      summary: Re-download a track at a different quality tier (up or down), replacing the existing file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                externalId: { type: string }
                libraryTrackId:
                  type: string
                  description: >-
                    Used to recover source/externalId from the original download
                    job when the caller does not know them. Without a recoverable
                    source the request is refused rather than guessed from text.
                artist: { type: string }
                title: { type: string }
                album: { type: string }
                quality:
                  type: string
                  enum: [low, medium, high, best]
                  description: Omit to use the track's standing quality (its override, else the global setting).
                currentQuality:
                  type: string
                  enum: [low, medium, high, best]
                  description: When given, a re-fetch at the tier the file already has is rejected as a no-op.
                setOverride:
                  type: boolean
                  description: Also persist quality as this track's standing override (needs libraryTrackId).
              required: [artist, title]
      responses:
        "200": { description: DownloadJob }
        "400": { description: missing artist/title or unknown tier }
        "422": { description: already at that tier, unknown source, or nothing can fetch it }
  /downloads/upgradable:
    get:
      summary: Completed downloads whose tier differs from the target (below it, or above it when downgrading)
      parameters:
        - name: quality
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high, best] }
          description: Defaults to the configured download_quality setting.
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
          description: Drop the tier filter and list every re-fetchable track (for the per-track quality picker).
      responses:
        "200": { description: array of tracks whose tier differs from the target }
  /links/resolve:
    post:
      summary: Resolve a Spotify or YouTube URL to track/album/playlist metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { url: { type: string } }
              required: [url]
      responses:
        "200": { description: ResolveResult }
        "400": { description: url is required }
        "422": { description: unsupported URL }
  /links/chapters:
    post:
      summary: List a source video's internal chapters (yt-dlp; no download)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { url: { type: string } }, required: [url] }
      responses:
        "200": { description: chapters (empty when the video has none) }
        "503": { description: no downloader can read chapters }
  /links/add:
    post:
      summary: Add a resolved track to the library and optionally enqueue a source-native download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                playlistId: { type: string }
                download: { type: boolean }
                quality:
                  type: string
                  enum: [low, medium, high, best]
                  description: Overrides the configured default quality for this download.
                startTime:
                  type: string
                  description: "YouTube only. Trim start as seconds, M:SS or H:MM:SS. Blank means from the beginning."
                endTime:
                  type: string
                  description: "YouTube only. Trim end, same formats. Blank means to the end."
                splitChapters:
                  type: boolean
                  description: >
                    YouTube only. Enqueue one download per internal chapter instead of one for the
                    whole video, each trimmed to its chapter and sharing the video title as album.
                    Mutually exclusive with startTime/endTime.
              required: [url]
      responses:
        "200": { description: "{ resolve, job?, jobs?, playlistId?, catalogId } — jobs is present only for a chapter split" }
        "400": { description: url is required }
        "404": { description: playlist not found }
        "422": { description: unsupported URL, bad time range, or chapter split not possible }
        "503": { description: no downloader configured }
  /links/add-batch:
    post:
      summary: Add many links at once (one POST per batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      url: { type: string }
                      playlistId: { type: string }
                      download: { type: boolean }
                      quality:
                        type: string
                        enum: [low, medium, high, best]
                      startTime: { type: string }
                      endTime: { type: string }
                      splitChapters: { type: boolean }
                    required: [url]
              required: [items]
      responses:
        "200": { description: "{ results: [{ url, resolve?, catalogId?, playlistId?, job?, jobs?, error? }] }" }
        "400": { description: items is required or too many items }
  /downloads/batch:
    post:
      summary: Enqueue multiple downloads in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks:
                  type: array
                  items:
                    type: object
                    properties:
                      source: { type: string }
                      externalId: { type: string }
                      artist: { type: string }
                      title: { type: string }
                      album: { type: string }
                      isrc: { type: string }
                    required: [source, externalId, artist, title]
              required: [tracks]
      responses: { "200": { description: array of DownloadJob }, "400": { description: invalid } }
  /ws:
    get:
      summary: >
        WebSocket of live events. Each frame is JSON { type, payload } where type
        is the EventBus topic (download.queued, download.progress,
        download.complete, download.failed, library.updated). Used by the client
        to flip a result to in-library, drive progress rings, and resync.
      responses:
        "101": { description: Switching Protocols (WebSocket upgrade) }
        "401": { description: unauthorized }
  /pairing/code:
    post:
      summary: Generate a single-use pairing code (manage-library capability required)
      responses:
        "200":
          description: pairing code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "AB12-CD34" }
                  expiresAt: { type: integer, format: int64 }
                required: [code, expiresAt]
        "503": { description: pairing unavailable }
  /pairing/redeem:
    post:
      summary: Redeem a pairing code for a new device (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                deviceName: { type: string }
              required: [code, deviceName]
      responses:
        "200":
          description: device credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  token: { type: string }
                  serverDeviceId: { type: string }
                required: [deviceId, token, serverDeviceId]
        "400": { description: invalid code or missing fields }
        "409": { description: code already used }
        "410": { description: code expired }
        "503": { description: pairing unavailable }
  /pairing/devices:
    get:
      summary: List paired devices (manage-library capability required)
      responses:
        "200":
          description: array of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    isServer: { type: boolean }
                    createdAt: { type: integer, format: int64 }
                    lastSeen: { type: integer, format: int64 }
                  required: [id, name, isServer, createdAt, lastSeen]
        "503": { description: pairing unavailable }
  /pairing/devices/{id}:
    delete:
      summary: Delete a paired device (cannot delete server device)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok }
        "400": { description: cannot delete server device }
        "404": { description: device not found }
        "503": { description: pairing unavailable }
  /sync:
    post:
      summary: Sync changes (Bearer sync token or local auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sinceRevision: { type: integer, format: int64 }
                changes:
                  type: array
                  items:
                    type: object
                    properties:
                      entityType: { type: string }
                      entityId: { type: string }
                      field: { type: string }
                      value: {}
                      updatedAt: { type: integer, format: int64 }
                      deviceId: { type: string }
                      revision: { type: integer, format: int64 }
                    required: [entityType, entityId, field, updatedAt]
              required: [sinceRevision, changes]
      responses:
        "200":
          description: sync response
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { type: object } }
                  newRevision: { type: integer, format: int64 }
                  accepted: { type: integer }
                  rejected: { type: array, items: { type: object } }
                required: [changes, newRevision, accepted]
        "401": { description: invalid sync token }
        "503": { description: sync unavailable }
  /sync/status:
    get:
      summary: Sync status (revision + device count) — requires auth either Bearer or local
      responses:
        "200":
          description: status
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: { type: integer, format: int64 }
                  deviceCount: { type: integer }
                required: [revision, deviceCount]
        "401": { description: invalid sync token }
        "503": { description: sync unavailable }
  /sync/trigger:
    post:
      summary: Start one device-sync round now (progress arrives over the WebSocket)
      responses:
        "202": { description: sync started }
        "503": { description: sync unavailable }
  /p2p/status:
    get:
      summary: Local libp2p host status (manage-library capability required)
      responses:
        "200":
          description: host status
          content:
            application/json:
              schema:
                type: object
                properties:
                  peerId: { type: string, description: Stable libp2p peer ID; also this device's Ed25519 verification key }
                  addrs: { type: array, items: { type: string }, description: Raw listen multiaddrs, including wildcards }
                  dialAddrs:
                    type: array
                    items: { type: string }
                    description: >
                      Complete /p2p/-terminated addresses another device can dial
                      this one on, with wildcard and loopback addresses removed.
                      Give one of these to a device on a VPN, where mDNS and the
                      DHT cannot resolve a bare peer ID.
                  peerCount: { type: integer, description: Currently connected peers, paired or not }
                  vector:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
                    description: Per-device sequence vector
                  hlc: { type: integer, format: int64, description: Highest hybrid logical clock seen }
                required: [peerId, addrs, dialAddrs, peerCount]
        "503": { description: p2p unavailable }
  /p2p/peers:
    get:
      summary: List connected libp2p peers (manage-library capability required)
      description: >
        Lists transport-level connections. Discovery is not trust: mDNS and DHT
        connect to unpaired peers, which are refused by the sync and file
        protocols. Pairing state is not reflected here.
      responses:
        "200":
          description: connected peers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    peerId: { type: string }
                    addrs: { type: array, items: { type: string } }
                    conns: { type: integer }
                    connected: { type: boolean }
                  required: [peerId, addrs, conns, connected]
        "503": { description: p2p unavailable }
  /p2p/pair/redeem:
    post:
      summary: Redeem a pairing code against a peer over libp2p (manage-library capability required)
      description: >
        Dials peerId and redeems code on it. On success both sides record each
        other as paired, binding the libp2p peer ID to a device row and its
        Ed25519 verification key, and persist the address used so later
        reconnects need no discovery. Rate limited per peer and globally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peerId:
                  type: string
                  description: >
                    Either a bare peer ID or a full multiaddr ending in
                    /p2p/<peerID>. The bare form only resolves where discovery
                    has already found the peer (a LAN, via mDNS); over a VPN the
                    full multiaddr from the other device's dialAddrs is required.
                  example: "/ip4/10.8.0.2/tcp/4331/p2p/12D3KooW..."
                code: { type: string, example: "AB12-CD34" }
                deviceName: { type: string }
              required: [peerId, code, deviceName]
      responses:
        "200":
          description: paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  token: { type: string }
                required: [deviceId, token]
        "400": { description: peerId, code and deviceName are required }
        "500": { description: pairing failed }
        "503": { description: p2p unavailable or peer trust store unavailable }
  /p2p/manifests:
    get:
      summary: List the local file manifest (manage-library capability required)
      responses:
        "200":
          description: file manifest rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    canonical_id: { type: string, description: "deviceId:relPath" }
                    content_hash: { type: string, description: SHA-256 of the file }
                    size: { type: integer, format: int64 }
                    rel_path: { type: string }
                    mtime: { type: integer, format: int64 }
                    device_id: { type: string }
                  required: [canonical_id, content_hash, size, rel_path, mtime, device_id]
        "500": { description: could not list manifests }
  /p2p/fetch:
    post:
      summary: Fetch a file from a paired peer (manage-library capability required)
      description: >
        contentHash is required and verified: the transfer lands in a temp file
        and is renamed into place only if the SHA-256 matches, so a hostile or
        failed fetch cannot replace a good local file. Take the hash from the
        peer's /p2p/manifests entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peerId: { type: string }
                relPath: { type: string, description: Path relative to the music dir; traversal and symlink escapes are rejected }
                contentHash: { type: string, description: Expected SHA-256, hex encoded }
              required: [peerId, relPath, contentHash]
      responses:
        "200":
          description: fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "400": { description: peerId, relPath and contentHash are required }
        "500": { description: fetch failed or hash mismatch }
        "503": { description: p2p unavailable, file store unavailable, or local device not initialized }
